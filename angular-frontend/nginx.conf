server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # product photos: product-service accepts up to 25 MB per request
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's own DNS: looks the gateway up again if its container restarts with a new address
  resolver 127.0.0.11 valid=10s;
  set $gateway http://api-gateway:8080;

  # every API call goes to the gateway, which checks the JWT and routes to the right service
  location /api/ {
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # index.html is never cached, so a new deployment shows up straight away
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Angular routes like /products/5 are handled by the app itself
  location / {
    try_files $uri $uri/ /index.html;
  }
}
