<div class="container py-5" style="max-width: 480px;">
  <h2 class="h4 mb-1">Create your account</h2>
  <p class="text-muted mb-4">Shop from every seller on RevShop.</p>

  @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label for="fullName" class="form-label">Full name</label>
      <input id="fullName" class="form-control" formControlName="fullName" autocomplete="name"
             [class.is-invalid]="showError('fullName')">
      <div class="invalid-feedback">Name is required.</div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" type="email" class="form-control" formControlName="email" autocomplete="email"
             [class.is-invalid]="showError('email')">
      <div class="invalid-feedback">Enter a valid email.</div>
    </div>

    <div class="mb-3">
      <label for="phone" class="form-label">Phone</label>
      <input id="phone" class="form-control" formControlName="phone" inputmode="numeric" maxlength="10"
             autocomplete="tel" [class.is-invalid]="showError('phone')">
      <div class="invalid-feedback">Phone must be exactly 10 digits.</div>
    </div>

    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input id="password" type="password" class="form-control" formControlName="password"
             autocomplete="new-password" [class.is-invalid]="showError('password')">
      <div class="invalid-feedback">At least 8 characters.</div>
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="saving()">
      {{ saving() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p class="text-center small mt-3 mb-1">Already have an account? <a routerLink="/login">Log in</a></p>
  <p class="text-center small mb-0">Want to sell? <a routerLink="/register/seller">Register as a seller</a></p>
</div>
