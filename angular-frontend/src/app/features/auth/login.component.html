<div class="container py-5" style="max-width: 440px;">
  <h2 class="h4 mb-1">Log in</h2>
  <p class="text-muted mb-4">Welcome back to RevShop.</p>

  @if (justRegistered) {
    <div class="alert alert-success">Account created. Log in to continue.</div>
  }
  @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" type="email" class="form-control" formControlName="email" autocomplete="email"
             [class.is-invalid]="showError('email')">
      <div class="invalid-feedback">Enter a valid email.</div>
    </div>

    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input id="password" type="password" class="form-control" formControlName="password"
             autocomplete="current-password" [class.is-invalid]="showError('password')">
      <div class="invalid-feedback">Password is required.</div>
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="saving()">
      {{ saving() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>

  <p class="text-center small mt-3 mb-0">
    New here? <a routerLink="/register">Create an account</a>
  </p>
</div>
