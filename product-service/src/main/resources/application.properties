spring.application.name=product-service
server.port=8082

# MySQL - products_db is created automatically
spring.datasource.url=jdbc:mysql://localhost:3306/revshop_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_Password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Feign: give up after 3 seconds if another service doesn't answer
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# Photo upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# AWS S3 for product photos (bucket is created on AWS later)
aws.region=ap-southeast-2
aws.s3.bucket=revshop-images-a86374

#Error handling messages in response body
server.error.include-message=always