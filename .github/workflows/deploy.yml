name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a running deploy
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [discovery-server, api-gateway, user-service, product-service, cart-service, order-service, payment-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build the jar (tests already run in CI)
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp -DskipTests package

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}/target
          file: deploy/Dockerfile.jar
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/revshop-${{ matrix.service }}:${{ github.sha }}

  frontend:
    name: Image frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: angular-frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/revshop-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: [backend, frontend]
    runs-on: [self-hosted, revshop]   # the runner on revshop-server, so no SSH is opened
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Pull and start the new images
        env:
          HUB: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd /opt/revshop
          test -f .env || { echo "::error::/opt/revshop/.env is missing"; exit 1; }
          cp "$GITHUB_WORKSPACE/deploy/compose.yaml" compose.yaml
          # keep the secrets in .env, only swap the image owner and tag
          sed -i '/^DOCKERHUB_USER=/d;/^IMAGE_TAG=/d' .env
          printf 'DOCKERHUB_USER=%s\nIMAGE_TAG=%s\n' "$HUB" "$TAG" >> .env
          docker compose config --quiet
          docker compose pull
          docker compose up -d --remove-orphans --wait --wait-timeout 600
          docker compose ps
          docker image prune -af --filter "until=72h"