name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # one failing service doesn't stop the others
      matrix:
        service: [discovery-server, api-gateway, user-service, product-service,
                  cart-service, order-service, payment-service]

    # a throwaway MySQL so the Spring Boot tests can start
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: revshop_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_Password: root           # the same env var our services read

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and run tests
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

  docker:
    name: Docker image ${{ matrix.service }}
    needs: backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [discovery-server, api-gateway, user-service, product-service,
                  cart-service, order-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed anywhere yet)
        run: docker build -t revshop/${{ matrix.service }}:${{ github.sha }} ${{ matrix.service }}

  frontend:
    name: Build Angular frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Angular app
        id: app
        run: |
          if [ -f angular-frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Angular app on this branch yet, skipping"
          fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: '22'

      - name: Install and build
        if: steps.app.outputs.exists == 'true'
        working-directory: angular-frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx ng build