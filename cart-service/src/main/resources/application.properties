spring.application.name=cart-service
server.port=8083

# MySQL - cart_db is created automatically
spring.datasource.url=jdbc:mysql://localhost:3306/revshop_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_Password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Feign: give up after 3 seconds if product-service doesn't answer
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=3000

#Error handling messages in response body
server.error.include-message=always